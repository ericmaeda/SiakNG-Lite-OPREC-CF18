version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: siakng_postgres
    restart: always
    environment:
      POSTGRES_USER: siakng
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: siakng_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
